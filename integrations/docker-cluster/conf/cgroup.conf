# Cgroup v2 plugin, unmanaged by systemd (there is no systemd in these
# containers). slurmstepd creates the job/step scope directories itself with
# mkdir instead of asking systemd for a delegated scope over dbus — see the
# note in src/core/attribution.cpp on what IgnoreSystemd does and does not
# change about where that directory ends up.
CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
ConstrainCores=no
# RAM/swap constraining is on so a job's --mem actually becomes that job's
# cgroup memory.max/memory.swap.max -- scenarios/oom.sh depends on a job's
# memory hog being killed by *its own* cgroup limit (which fires the oom
# probe's mark_victim tracepoint, attributed to that job) rather than only a
# node-wide OOM, which would be both undeterministic and liable to take
# something else down with it.
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
ConstrainDevices=no
