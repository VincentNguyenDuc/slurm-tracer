# Minimal Slurm config for the integration-test cluster. One controller
# ("ctld") and N workers, named for the docker-compose services they run as so
# Slurm's node names resolve over the compose network with no extra DNS setup.
ClusterName=docker-test
SlurmctldHost=ctld

AuthType=auth/munge
CredType=cred/munge

SlurmUser=slurm
SlurmdUser=root

SlurmctldPort=6817
SlurmdPort=6818

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# task/cgroup + proctrack/cgroup are what makes slurmstepd create the
# job_<id>/step_<id> cgroup directories that slurm-tracer's attribution
# resolver depends on (docs/DESIGN.md §4). Without this, jobs run under
# proctrack/linuxproc and there is nothing for the resolver to find.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
JobAcctGatherType=jobacct_gather/cgroup

SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# Containers report the host's full CPU/memory info, which rarely matches the
# small NodeName= line below; without this a node goes to state "invalid"
# instead of registering.
SlurmdParameters=config_overrides

ReturnToService=2
SlurmctldTimeout=60
SlurmdTimeout=60
MessageTimeout=10

NodeName=c[1-2] CPUs=1 RealMemory=512 State=UNKNOWN
# FORCE:32 lets the sched_latency integration test oversubscribe each
# 1-CPU node with many concurrent tasks to generate real run-queue
# contention -- see integrations/docker-cluster/test.sh.
PartitionName=debug Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP OverSubscribe=FORCE:32
