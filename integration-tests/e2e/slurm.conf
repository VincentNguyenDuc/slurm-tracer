# Minimal two-node test cluster.
#
# The point of this configuration is to make slurmstepd build a real cgroup/v2
# hierarchy that slurm-tracer can resolve against; it is not a template for a
# production cluster.

ClusterName=testcluster
SlurmctldHost=slurmctld

SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge

# Debian's defaults point at a mail program and a PMIx library that are not
# installed here; both only produce startup errors in a test cluster.
MailProg=/bin/true
MpiDefault=none

SlurmctldPort=6817
SlurmdPort=6818

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# cgroup containment is the whole reason this cluster exists: it is what
# creates job_<id>/step_<id>/user/task_<id>, the tree the resolver walks.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
JobAcctGatherType=jobacct_gather/cgroup

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# No slurmdbd: M1 only needs job ids, not the accounting database.
AccountingStorageType=accounting_storage/none

# Containers come and go; do not park nodes in DOWN on a slow start.
ReturnToService=2
SlurmctldTimeout=60
SlurmdTimeout=60

NodeName=c[1-2] CPUs=2 RealMemory=512 State=UNKNOWN
PartitionName=debug Nodes=ALL Default=YES MaxTime=INFINITE State=UP
