# A two-node Slurm cluster for end-to-end testing of slurm-tracer.
#
# The compute nodes are privileged and run in the host cgroup namespace: both
# are needed because slurmstepd creates cgroups and slurm-tracer loads BPF
# programs. Nothing here is a model for production deployment.

name: slurm-tracer-e2e

services:
  slurmctld:
    build:
      context: ../..
      dockerfile: integration-tests/e2e/Dockerfile
    image: slurm-tracer-e2e:latest
    command: ["ctld"]
    hostname: slurmctld
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  c1:
    image: slurm-tracer-e2e:latest
    depends_on:
      slurmctld:
        condition: service_started
    command: ["node"]
    hostname: c1
    # slurmstepd must create cgroups, and slurm-tracer must load BPF programs
    # and read the kernel's BTF. Deliberately NOT `cgroup: host`: the container
    # gets its own cgroup namespace, so Slurm's hierarchy is built inside the
    # container rather than in the host's tree. Cgroup *ids* are inode numbers
    # and are unaffected by the namespace, so attribution still resolves.
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
    ulimits:
      memlock: -1

  c2:
    image: slurm-tracer-e2e:latest
    depends_on:
      slurmctld:
        condition: service_started
    command: ["node"]
    hostname: c2
    privileged: true
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw
    ulimits:
      memlock: -1
