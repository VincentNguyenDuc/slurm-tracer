# cgroup/v2 without systemd.
#
# Slurm normally asks systemd over dbus to create the slurmstepd scope. There is
# no systemd or dbus in these containers, so IgnoreSystemd tells slurmstepd to
# mkdir the scope itself. The resulting hierarchy is identical, which is exactly
# what makes this a fair test of the resolver.
CgroupPlugin=cgroup/v2
IgnoreSystemd=yes
IgnoreSystemdOnFailure=yes

ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainDevices=no
